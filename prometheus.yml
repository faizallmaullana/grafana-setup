global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: 'prometheus'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'backend'
    scrape_interval: 10s
    http_headers:
      X-API-Key:
        values:
          - "kelolakey380600"
    static_configs:
      - targets:
          - 'host.docker.internal:8080'
        labels:
          service: 'Localhost'
          env: 'prod'
      - targets:
          - 'gaiahomecleaning.kelolaaja.id'
        labels:
          service: 'Gaia Home Cleaning'
          env: 'prod'
      - targets:
          - 'mbfurnistore.kelolaaja.id'
        labels:
          service: 'MB Furni Store'
          env: 'prod'
      - targets:
          - 'testlive.kelolaaja.id'
        labels:
          service: 'Test Live'
      - targets:
          - 'demo.kelolaaja.id'
        labels:
          service: 'Demo'
      - targets:
          - 'damikabuanaindonesia.kelolaaja.id'
        labels:
          service: 'Damika Buana Indonesia'
      - targets:
          - 'sriendo.kelolaaja.id'
        labels:
          service: 'Sriendo'
    metrics_path: '/api/v1/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
